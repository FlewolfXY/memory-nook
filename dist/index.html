<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eee7dc"><title>The Memory Nook · 记忆小屋</title><link rel="stylesheet" href="./style.css"></head><body>
<div id="scene" aria-label="可旋转的三维记忆小屋"></div>
<header><a class="brand" href="#" id="home"><span class="mark">⌂</span><span>The Memory Nook<small>A LITTLE PLACE OF YOUR OWN</small></span></a><nav><button id="arrange">布置小屋</button><button id="box">记忆匣 <span id="count">3</span></button><button id="settings" aria-label="设置与备份">•••</button></nav></header>
<button id="space-exit" class="space-exit" aria-label="去花园与池塘">去花园与池塘 <span aria-hidden="true">↗</span></button><section class="welcome"><p class="eyebrow">YOUR OWN LITTLE CORNER</p><h1>回来就好。</h1><p>让今天的小事，也有一个位置。</p><span class="room-label">01 / 窗边的房间</span><button id="pond-invite">＋ 让一个片刻游起来</button></section>
<aside class="view-tools" aria-label="视角控制"><button id="left" title="向左旋转">↶</button><button id="reset" title="复位视角">⌂</button><button id="right" title="向右旋转">↷</button><span></span><button id="zoom-in" title="放大">＋</button><button id="zoom-out" title="缩小">−</button></aside>
<div class="ambience"><button id="day">☀ 午后</button><button id="music">♫ 音乐关</button></div>
<footer><div class="foot-note"><span class="tiny-star">✧</span><div id="observation">翻一本书，听听抱枕的故事。<small>屋里的小东西，都可以留下你的记忆。</small></div></div><button class="primary add" id="add">＋ 留下一个片刻 <small>ADD A MEMORY</small></button></footer>
<div id="edit-help" hidden>拖动摆放 · Shift 拖动调高度 · R 旋转<br>点击小物件选择，完成布置后点开读故事</div><div id="object-tools" hidden><b id="object-name"></b><button id="turn-object">旋转 ↻</button><label>高度 <input id="object-height" type="range" min="0" max="3.7" step=".02"></label><button id="reset-object">放回原处</button></div><div id="placement" hidden><div><b>给它找一个位置</b><p>点桌面、窗台或架子上的光圈 · R 旋转 · Esc 取消</p></div><div id="spots"></div><div class="row"><button id="cancel-place">稍后安放</button><button id="rotate-place">旋转 ↻</button><button class="primary" id="confirm-place">就放在这里</button></div></div>
<dialog id="panel"><button class="close" id="close" aria-label="关闭">×</button><p class="eyebrow" id="panel-kicker"></p><h2 id="panel-title"></h2><div id="content"></div></dialog><div id="object-hint" hidden></div><div id="toast" role="status"></div><script type="module" src="./app.mjs"></script></body></html>
